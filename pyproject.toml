[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketing-mcp"
version = "0.1.0"
description = "Marketing MCP tools (GA4, GSC, Google/Meta/ChatGPT Ads, SEO, crawl, prospecting)."
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "google-ads>=24.0.0",
  "google-auth-oauthlib>=1.2.0",
  "pytrends>=4.9.2",
  "google-analytics-data>=0.18.0",
  "google-api-python-client>=2.100",
  "beautifulsoup4>=4.12",
  "pillow>=10.0",
  "anthropic>=0.50",
  "tzdata>=2024.1",
]

# Flat modules that import each other at top level (import server, import seo_rules, ...).
# Installing them as py-modules puts them on sys.path so `import server` works with no path hack.
[tool.setuptools]
py-modules = [
  "ai_ask", "ai_visibility", "copy_check", "doctor", "email_checks",
  "governor", "governor_setup", "growth", "oauth_setup", "prospecting",
  "register", "run_tool", "seo_rules", "server", "site_hygiene",
  "sitefetch", "workflows",
]
